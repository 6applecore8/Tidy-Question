spring:
  application:
    name: tidy-question-backend
  profiles:
    # 默认使用 local，本地敏感信息放在 application-local.yml
    # 生产环境可通过 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tidy_question}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.tidyquestion.backend: INFO

app:
  auth:
    username: ${APP_AUTH_USERNAME:}
    password: ${APP_AUTH_PASSWORD:}
  jwt:
    # 使用新键名，避免被历史 APP_JWT_SECRET 空值意外覆盖
    signing-key: ${APP_JWT_SIGNING_KEY:}
    expire-hours: ${APP_JWT_EXPIRE_HOURS:24}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./data/uploads}
  rag:
    embedding-dimension: ${APP_RAG_EMBEDDING_DIMENSION:1536}
    top-k: ${APP_RAG_TOPK:4}
    chunk-size: ${APP_RAG_CHUNK_SIZE:600}
    chunk-overlap: ${APP_RAG_CHUNK_OVERLAP:100}
  model:
    base-url: ${APP_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${APP_MODEL_API_KEY:}
    chat-model: ${APP_MODEL_CHAT:qwen-plus}
    embedding-model: ${APP_MODEL_EMBEDDING:text-embedding-v4}
    timeout-seconds: ${APP_MODEL_TIMEOUT_SECONDS:45}

