version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tidy-question-postgres
    environment:
      POSTGRES_DB: tidy_question
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tidy_question"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: tidy-question-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tidy-question-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tidy_question
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_MODEL_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      APP_MODEL_API_KEY: ${APP_MODEL_API_KEY}
      APP_MODEL_CHAT: qwen-plus
      APP_MODEL_EMBEDDING: text-embedding-v4
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: 123456
      APP_JWT_SECRET: change-this-to-a-long-random-secret-at-least-32-chars
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"

volumes:
  pg_data:
